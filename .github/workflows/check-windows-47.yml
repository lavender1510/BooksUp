name: BooksUp Windows 4.8 verification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'electron/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/check-windows-47.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-checks:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:static
      - run: node tools/test-offline.cjs
      - run: node tools/test-54.cjs
      - run: node --check electron/booksup-windows-48.js
      - run: node --check electron/main.cjs
      - run: node --check electron/preload.cjs

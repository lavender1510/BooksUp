name: BooksUp Android Source and Native QA
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'tools/android-init.cjs'
      - 'tools/test-android-48.cjs'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/check-android-48.yml'
      - 'CHANGELOG.md'
      - 'www/**'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-android-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:static
      - run: node tools/test-android-48.cjs
      - run: node tools/test-54.cjs
      - run: node --check mobile/booksup-android-48.js
      - run: node --check tools/android-init.cjs

  verify-compiled-android-manifest:
    name: Compile Android and inspect LAN policy (CI only, not distributed)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm install --no-audit --no-fund
      - name: Create temporary CI signing key (NOT the publisher key)
        shell: bash
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/qa-only.p12" -storetype PKCS12 -alias ci-qa -storepass qa-only-testing -keypass qa-only-testing -dname 'CN=BooksUp QA,O=CI,C=DE' -keyalg RSA -keysize 2048 -validity 2
          echo "BOOKSUP_RELEASE_KEYSTORE=$RUNNER_TEMP/qa-only.p12" >> "$GITHUB_ENV"
      - name: Verify release variant with ephemeral CI-only key (NEVER distributed)
        env:
          BOOKSUP_RELEASE_STORE_PASSWORD: qa-only-testing
          BOOKSUP_RELEASE_KEY_ALIAS: ci-qa
          BOOKSUP_RELEASE_KEY_PASSWORD: qa-only-testing
        run: npm run android:release
      - name: Verify generated manifest permits validated private LAN signaling
        shell: bash
        run: |
          APK='release/BooksUp-5.6.0.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep 'usesCleartextTraffic' "$RUNNER_TEMP/manifest.txt"
          grep -q 'usesCleartextTraffic.*0xffffffff' "$RUNNER_TEMP/manifest.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='5.6.0'"
          unzip -l "$APK" | grep -q 'assets/public/booksup-53.js'
          unzip -l "$APK" | grep -q 'assets/public/booksup-56.js'
          unzip -l "$APK" | grep -q 'assets/public/booksup-54-features.css'
          echo 'Compiled Android native modules and verified local LAN manifest policy.'

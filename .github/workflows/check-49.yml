name: BooksUp 5.0 Cross-Platform Verification
on:
  pull_request:
    paths:
      - 'www/**'
      - 'mobile/**'
      - 'electron/**'
      - 'mobile/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/check-49.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source validation
        run: npm run test:static
      - name: BooksUp 5.6 focused regression tests
        run: node tools/test-56-functional.cjs
      - name: BooksUp 5.6 external integrations (mocked)
        run: node tools/test-56-integrations.cjs
      - name: Validate LibreTranslate Docker Compose file
        run: docker compose --env-file deploy/libretranslate/.env.example -f deploy/libretranslate/compose.yml config --quiet
      - name: Verify keyless self-hosted LibreTranslate deployment configuration
        run: node tools/test-libretranslate-selfhost.cjs
      - name: Probe public LibreTranslate instance (informational, no user data)
        run: node tools/probe-libretranslate.cjs
      - name: Cross-platform regression tests
        run: |
          node tools/test-49.cjs
          node tools/test-50.cjs
          node tools/test-51.cjs
          node tools/test-52.cjs
          node tools/test-53.cjs
          node tools/test-54.cjs
          node tools/test-50.cjs
          node tools/test-windows-47.cjs
          node tools/test-windows-48.cjs
          node tools/test-android-48.cjs
      - name: Check native and shared JavaScript
        run: |
          node --check electron/main.cjs
          node --check electron/booksup-drive.cjs
          node --check electron/preload.cjs
          node --check www/booksup-49.js
          node --check www/cloud-drive.js
          node --check www/booksup-50.js
          node --check www/booksup-50-pair.js
          node --check www/booksup-50-services.js
          node --check www/booksup-53.js
          node --check tools/test-54.cjs
          node --check tools/build-android-release.cjs

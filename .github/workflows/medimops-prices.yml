name: Refresh BooksUp MediMops Prices
on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch prices from publisher-configured provider
        env:
          BOOKSUP_MEDIMOPS_PROVIDER_URL: ${{ secrets.BOOKSUP_MEDIMOPS_PROVIDER_URL }}
          BOOKSUP_MEDIMOPS_PROVIDER_TOKEN: ${{ secrets.BOOKSUP_MEDIMOPS_PROVIDER_TOKEN }}
          BOOKSUP_MOMOX_API_TOKEN: ${{ secrets.BOOKSUP_MOMOX_API_TOKEN }}
          BOOKSUP_MOMOX_EANS: ${{ vars.BOOKSUP_MOMOX_EANS }}
          BOOKSUP_MOMOX_MARKETPLACE_ID: momox_de
        run: node tools/refresh-medimops.cjs
      - name: Commit verified public prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/medimops-prices.json
          git diff --cached --quiet || (git commit -m 'chore: update price feed [skip ci]' && git push)

name: Cancel unexpected Android run 4.8
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-android-48.yml'
permissions:
  contents: read
  actions: write
jobs:
  cancel-android:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop Android workflow from Windows-only 4.8 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/${GH_REPO}/actions/runs/39246332573/cancel" || true
          gh api -X POST "repos/${GH_REPO}/actions/runs/39246332573/force-cancel" || true

name: BooksUp Android APK + GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'tools/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: booksup-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout BooksUp
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install NPM dependencies
        run: npm install --no-audit --no-fund

      - name: Configure Google OAuth (optional until Cloud Console is set up)
        env:
          BOOKSUP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BOOKSUP_GOOGLE_WEB_CLIENT_ID }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('www/cloud-drive-config.js','window.BOOKSUP_GOOGLE_WEB_CLIENT_ID='+JSON.stringify(process.env.BOOKSUP_GOOGLE_WEB_CLIENT_ID||'')+';\\n')"
      - name: Check BooksUp source
        run: npm run test:static

      - name: Set persistent debug signing key (optional)
        env:
          BOOKSUP_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.BOOKSUP_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BOOKSUP_ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$BOOKSUP_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Persistent Android debug signing enabled"
          else
            echo "::warning::No persistent APK signing certificate configured. This APK may not update previous installations; do not uninstall your existing app to install it."
          fi

      - name: Build Android debug APK
        run: npm run android:apk

      - name: Verify APK exists
        run: test -s release/BooksUp-debug.apk

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooksUp-debug-apk
          path: release/BooksUp-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v4.3.0-test.1"
          cat > release-notes.md <<'NOTES'
          # BooksUp 4.3.0 – Android backup fix

          **BooksUp-debug.apk** is an installable Android debug APK for testing.
          This is **not** a production-signed Play Store release.

          - Live profile previews, avatar crop/zoom and profile synchronization
          - Multi-book import, PDF covers, metadata editing and automatic fullscreen sessions
          - Improved online book search and recommendation controls
          - Same BooksUp web interface as Electron desktop edition
          - PDF/EPUB/comic reading and local library
          - Android packaging with Capacitor
          - Offline assets bundled into the APK
          - Memory-efficient Android backup export
          - Update checks via GitHub releases

          Android may ask you to allow installs from this source. Only install this APK if you trust this repository.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/BooksUp-debug.apk --clobber
            gh release edit "$TAG" --title 'BooksUp 4.3.0 – Android Backup-Fix' --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" release/BooksUp-debug.apk --title 'BooksUp 4.3.0 – Android Backup-Fix' --notes-file release-notes.md --prerelease --target "$GITHUB_SHA"
          fi

name: BooksUp Android APK + GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
      - 'capacitor.config.json'
      - 'tools/**'

permissions:
  contents: write

concurrency:
  group: booksup-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout BooksUp
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install NPM dependencies
        run: npm install --no-audit --no-fund

      - name: Configure Google OAuth (optional until Cloud Console is set up)
        env:
          BOOKSUP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BOOKSUP_GOOGLE_WEB_CLIENT_ID }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('www/cloud-drive-config.js','window.BOOKSUP_GOOGLE_WEB_CLIENT_ID='+JSON.stringify(process.env.BOOKSUP_GOOGLE_WEB_CLIENT_ID||'')+';\\n')"
      - name: Check BooksUp source
        run: npm run test:static

      - name: Verify Android mobile compatibility
        run: |
          node tools/test-android-48.cjs
          node tools/test-49.cjs

      - name: Set persistent debug signing key (optional)
        env:
          BOOKSUP_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.BOOKSUP_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BOOKSUP_ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$BOOKSUP_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Persistent Android debug signing enabled"
          else
            echo "::warning::No persistent APK signing certificate configured. This APK may not update previous installations; do not uninstall your existing app to install it."
          fi

      - name: Build Android debug APK
        run: npm run android:apk

      - name: Verify APK exists
        run: test -s release/BooksUp-debug.apk

      - name: Verify Android release version and bundled mobile modules
        run: |
          unzip -l release/BooksUp-debug.apk | grep 'assets/public/booksup-android-48.js'
          unzip -l release/BooksUp-debug.apk | grep 'assets/public/booksup-android-48.css'
          unzip -p release/BooksUp-debug.apk assets/public/index.html > "$RUNNER_TEMP/booksup-android-index.html"
          grep -q 'const APP_VERSION="4.9.0";' "$RUNNER_TEMP/booksup-android-index.html"
          grep -q 'booksup-android-48.js' "$RUNNER_TEMP/booksup-android-index.html"
          grep -q 'booksup-android-48.css' "$RUNNER_TEMP/booksup-android-index.html"
          grep -q 'booksup-49.js' "$RUNNER_TEMP/booksup-android-index.html"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/BooksUp-debug.apk | grep "versionName='4.9.0'"

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooksUp-debug-apk
          path: release/BooksUp-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v4.9.0-android.1"
          cat > release-notes.md <<'NOTES'
          # BooksUp 4.9.0 – Reading Lists, News and Cross-Device Sync

          **BooksUp-debug.apk** is the Android 4.8.0 test build (versionCode 40900).
          It is a debug APK, NOT a production-signed Play Store release.

          - Reading-list deletions now use stable entry IDs; original books are not deleted.
          - Large reading-list tiles with latest-book cover previews.
          - Profile sections follow the requested order; statistics remain compact on Android.
          - Theme colors, custom combinations and noticeably scaled font-size settings.
          - Discovery books can be saved in the preferred reading list.
          - Expanded Google Books, Open Library and German National Library metadata/ISBN search using native HTTP.
          - Reader notes, page-area annotations, full-screen and touch-friendly PDF controls.
          - News capitalization and version changelog.
          - Admin/editorial settings are hidden until the GitHub OAuth backend is configured.

          **Important: Back up your library before installing.**
          Updating an installed app requires the SAME Android signing certificate as the previous APK.
          Without the GitHub secret BOOKSUP_ANDROID_DEBUG_KEYSTORE_BASE64, CI uses an ephemeral
          debug certificate. In that case an in-place update may fail; do NOT uninstall BooksUp
          or delete its app data unless your backup is successfully verified.
          The MediMops price feed also requires a real configured provider; ISBN discovery alone
          cannot supply genuine prices.

          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/BooksUp-debug.apk --clobber
            gh release edit "$TAG" --title 'BooksUp 4.9.0 – Android Update' --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" release/BooksUp-debug.apk --title 'BooksUp 4.8.0 – Android Update' --notes-file release-notes.md --prerelease --target "$GITHUB_SHA"
          fi

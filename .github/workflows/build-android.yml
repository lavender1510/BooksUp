name: BooksUp Android Production Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'mobile/**', 'assets/**', 'tools/**', 'package.json', '.github/workflows/build-android.yml']
permissions:
  contents: write
concurrency:
  group: booksup-android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-release:
    name: Signed Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Require permanent production signing key
        env:
          KEYSTORE: ${{ secrets.BOOKSUP_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.BOOKSUP_ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOOKSUP_ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BOOKSUP_ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing production signing secrets. Refusing to publish a debug APK. Configure BOOKSUP_ANDROID_RELEASE_* in GitHub Actions Secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/booksup-release.keystore"
          chmod 600 "$RUNNER_TEMP/booksup-release.keystore"
          echo "BOOKSUP_RELEASE_KEYSTORE=$RUNNER_TEMP/booksup-release.keystore" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: |
          npm run test:static
          node tools/test-android-48.cjs
          node tools/test-49.cjs
          node tools/test-50.cjs
          node tools/test-51.cjs
          node tools/test-52.cjs
          node tools/test-53.cjs
          node tools/test-54.cjs
      - name: Build signed production APK
        env:
          BOOKSUP_RELEASE_STORE_PASSWORD: ${{ secrets.BOOKSUP_ANDROID_RELEASE_STORE_PASSWORD }}
          BOOKSUP_RELEASE_KEY_ALIAS: ${{ secrets.BOOKSUP_ANDROID_RELEASE_KEY_ALIAS }}
          BOOKSUP_RELEASE_KEY_PASSWORD: ${{ secrets.BOOKSUP_ANDROID_RELEASE_KEY_PASSWORD }}
          BOOKSUP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BOOKSUP_GOOGLE_WEB_CLIENT_ID }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('www/cloud-drive-config.js','window.BOOKSUP_GOOGLE_WEB_CLIENT_ID='+JSON.stringify(process.env.BOOKSUP_GOOGLE_WEB_CLIENT_ID||'')+';\n')"
          node tools/build-android-release.cjs
      - name: Verify signed release and LAN policy
        shell: bash
        run: |
          APK="release/BooksUp-5.4.0.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='5.4.0'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'usesCleartextTraffic'
          unzip -p "$APK" assets/public/index.html | grep -q 'const APP_VERSION="5.4.0";'
          ! unzip -p "$APK" assets/public/index.html | grep -q 'href="booksup-android-48.css"'
          ! unzip -p "$APK" assets/public/index.html | grep -q 'href="booksup-53.css"'
          for f in booksup-53.js booksup-52.js booksup-54-features.css; do unzip -l "$APK" | grep -q "assets/public/$f"; done
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooksUp-5.4.0-Android-Production
          path: release/BooksUp-5.4.0.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish stable Android release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG='v5.4.0-android'
          cat > release-notes.md <<'NOTES'
          # BooksUp 5.4.0 – Original 4.6 Mobile Look and New Features
          Signed release build (NOT debug). Existing debug-signed installations
          require a verified complete backup before migration. In-place upgrades
          require the same signing certificate.
          - Restored original Android 4.6 profile, reading-list and visual styles.
          - Retained 5.3 features: PDF zoom/annotations, PIN pairing, metadata, signed updates.
          - Fixed Android LAN manifest restriction from the supplied screenshot.
          - Persistent PDF zoom and repaired highlight selection.
          - Responsive mobile controls, independent scrolling and toolbar layout.
          - Update download progress and signing validation; improved UI translations.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/BooksUp-5.4.0.apk --clobber
            gh release edit "$TAG" --title 'BooksUp 5.4.0 – Android Production' --notes-file release-notes.md --prerelease=false
          else
            gh release create "$TAG" release/BooksUp-5.4.0.apk --title 'BooksUp 5.4.0 – Android Production' --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

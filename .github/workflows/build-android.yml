name: BooksUp Android APK and Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'tools/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static checks
        run: npm run test:static
      - name: Build BooksUp-debug.apk
        run: npm run android:apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BooksUp-debug-apk
          path: release/BooksUp-debug.apk
          if-no-files-found: error
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.0.0-test.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/BooksUp-debug.apk --clobber
          else
            gh release create "$TAG" release/BooksUp-debug.apk --title "BooksUp 3.0 - Android Test" --notes "BooksUp Android debug APK for testing; not a Play Store signed release." --prerelease --target "$GITHUB_SHA"
          fi

name: Import BooksUp and publish test APK
on:
  push:
    paths: ['BooksUp-release-ready.zip', '.github/workflows/bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Import complete BooksUp sources
        run: |
          unzip -o BooksUp-release-ready.zip -d .
          rm BooksUp-release-ready.zip
      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset HEAD -- .github/workflows/build-android.yml .github/workflows/build-desktop.yml
          git diff --cached --quiet || git commit -m "feat: add complete BooksUp desktop and Android project"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install npm packages
        run: npm install --no-audit --no-fund
      - name: Static tests
        run: npm run test:static
      - name: Build BooksUp APK
        run: npm run android:apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooksUp-debug-apk
          path: release/BooksUp-debug.apk
          if-no-files-found: error
      - name: Create Android test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.0.0-test.1 release/BooksUp-debug.apk --title "BooksUp 3.0 – Android Test" --notes "Android test APK (debug signed). Not for Play Store. Electron sources included in this repository." --prerelease --target main

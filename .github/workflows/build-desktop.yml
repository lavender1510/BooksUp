name: BooksUp Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'electron/**'
      - 'package.json'
      - 'tools/**'
      - '.github/workflows/build-desktop.yml'
      # Android-only changes must never overwrite the existing Windows 4.8 release.
      - '!tools/android-init.cjs'
      - '!tools/test-android-48.cjs'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:static
      - run: node tools/test-55.cjs
      - run: node tools/test-55-behavior.cjs
      - run: node tools/test-55-navigation-regression.cjs
      - run: npm run desktop:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BooksUp-Windows-EXE
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Publish stable Windows release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v5.5.1'
          $assets=@(Get-ChildItem release -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' } | Select-Object -ExpandProperty FullName)
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --latest=true --target $env:GITHUB_SHA --title 'BooksUp 5.5.1 – Windows Release' --notes 'BooksUp 5.5.1 Windows 5.2 design; News and Settings routing hotfix. The installer supports in-app updates and download progress. Windows executables are not Authenticode-signed until a publisher certificate is configured.'
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows EXEs' }
          gh release edit $tag --title 'BooksUp 5.5.1 – Windows Release' --prerelease=false --latest=true

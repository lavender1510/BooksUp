name: BooksUp Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'electron/**'
      - 'package.json'
      - '.github/workflows/build-desktop.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:static
      - run: npm run desktop:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BooksUp-Windows-EXE
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Publish test EXE
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v4.0.0'
          $assets=@(Get-ChildItem release -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' } | Select-Object -ExpandProperty FullName)
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'BooksUp - Windows Test' --notes 'BooksUp 3.2.2 Windows test build (installer + portable EXE). Installer supports app-managed updates. Unsigned test application.' --prerelease
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows EXEs' }

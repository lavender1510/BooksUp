  const ignored=new Set((rec.exclude||[]).map(norm)),allowedG=new Set((rec.includeGenres||[]).map(norm)),allowedT=new Set((rec.includeTags||[]).map(norm));

/* ---------- Goodreads-Import ---------- */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
    else{if(c=='"')q=true;else if(c==','){row.push(cur);cur=''}else if(c=='\r'){}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''))}
function gqDate(s){if(!s)return null;const d=new Date(s.trim());return isNaN(d.getTime())?null:iso(d.getTime())}
function gqPick(){return buGoodreadsPick();raw('.csv,text/csv',f=>{const r=new FileReader();
  r.onload=()=>{try{gqRun(String(r.result))}catch(e){console.error(e);alert('Import fehlgeschlagen: '+((e&&e.message)||e))}};
  r.onerror=()=>alert('Datei konnte nicht gelesen werden.');
  r.readAsText(f,'utf-8')})}
function gqRun(text){
  const rows=parseCSV(text);
  if(rows.length<2)return alert('Keine Daten gefunden. Ist das eine Goodreads-Export-CSV (Mein Konto → Tools → Import/Export)?');
  const head=rows[0].map(h=>h.trim().replace(/^﻿/,'')),idx=n=>head.indexOf(n);
  const iTitle=idx('Title'),iAuthor=idx('Author'),iRating=idx('My Rating'),iYearO=idx('Original Publication Year'),iYearP=idx('Year Published'),
        iPages=idx('Number of Pages'),iShelf=idx('Exclusive Shelf'),iDateRead=idx('Date Read'),iDateAdd=idx('Date Added'),iShelves=idx('Bookshelves');
  if(iTitle<0||iAuthor<0)return alert('CSV sieht nicht wie ein Goodreads-Export aus (Spalte „Title" oder „Author" fehlt).');
  let added=0,skipped=0;
  for(let k=1;k<rows.length;k++){
    const r=rows[k];if(!r||!(r[iTitle]||'').trim())continue;
    const title=(r[iTitle]||'').trim(),author=(r[iAuthor]||'').trim();
    const ex=S.books.find(b=>b.title.trim().toLowerCase()==title.toLowerCase()&&(b.author||'').trim().toLowerCase()==author.toLowerCase());
    if(ex){skipped++;continue}
    const shelf=(iShelf>=0?r[iShelf]:'').trim();
    const ratingN=iRating>=0?+r[iRating]:0;
    const year=((iYearO>=0&&r[iYearO])||(iYearP>=0&&r[iYearP])||'').trim();
    const pages=iPages>=0?(+r[iPages]||undefined):undefined;
    const tags=iShelves>=0?(r[iShelves]||'').split(',').map(s=>s.trim()).filter(s=>s&&!['read','to-read','currently-reading'].includes(s)).join(', '):'';
    const b={id:Date.now()+k,added:Date.now()+k,type:'physical',title,author,year,tags,qty:1,price:null,pages,rating:ratingN>0?Math.min(5,ratingN):null};
    if(shelf=='read'){b.finished=gqDate(iDateRead>=0?r[iDateRead]:'')||gqDate(iDateAdd>=0?r[iDateAdd]:'')||iso(Date.now());b.started=b.finished}
    else if(shelf=='currently-reading'){b.started=gqDate(iDateAdd>=0?r[iDateAdd]:'')||iso(Date.now())}
    S.books.push(b);added++}
  shf='physical';view='shelf';addType=null;draft={};save();
  modal=`<h3 style="margin:0 0 8px">Goodreads-Import</h3><p>${added} Bücher hinzugefügt als physisch (gelesen/wird gelesen anhand deiner Goodreads-Regale übernommen).${skipped?' '+skipped+' waren schon vorhanden und wurden übersprungen.':''}</p><button class="btn" onclick="modal=null;render()">Schließen</button>`;render()}

function goals(){

  return bar('Ziele')+`<div class="card"><label>Was?</label><select id="gu"><option>Kapitel</option><option>Bücher</option><option>Seiten</option></select><label>Zeitraum</label><select id="gp"><option>Tag</option><option selected>Woche</option><option>Monat</option><option>Jahr</option></select>

  const C=window.Capacitor&&Capacitor.Plugins;add((C&&C.Filesystem&&C.Share)?true:(navigator.canShare?true:null),'Backup teilen',(C&&C.Filesystem&&C.Share)?'Android-Teilen-Dialog':navigator.canShare?'Web-Teilen':'Download-Link');
  add(navigator.onLine,'Internetverbindung',navigator.onLine?'online':'offline · alle lokalen Funktionen verfügbar')}

const INTRO=[
 ['Willkommen bei BooksUp','Deine Bibliothek und dein Lese-Tracker in einer App: digitale Bücher (PDF, EPUB, Comics) und gedruckte Bücher an einem Ort. Alles läuft offline und bleibt auf deinem Gerät.'],
 ['Lesen, wie du magst','Im Leser findest du über „Aa“ drei Modi: Buchseiten zum Blättern, Scrollen wie auf einer Webseite oder Text im Wattpad-Stil. Dazu kommen Kapitelanzeige, Lesezeichen, Suche, Vollbild und automatisches Scrollen.'],
 ['Dranbleiben','Starte eine Lesesitzung, dann zählt BooksUp Zeit, Seiten und Kapitel. Setze Ziele und ein Jahresziel, sammle deine Lese-Serie und lass dich täglich erinnern (Einstellungen).'],
 ['Deine Daten gehören dir','Sichere deine Bücher und Fortschritte regelmäßig unter Einstellungen → Backup. Lokale Datensicherung benötigt keinen Server.']];
function showIntro(i=0){
  let o=$('intro');if(!o){o=document.createElement('div');o.id='intro';o.className='intro';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Einführung');document.body.appendChild(o)}
  const[t,x]=INTRO[i];
  o.innerHTML=`<div class="introc"><div class="dots">${INTRO.map((_,k)=>`<i class="${k==i?'on':''}"></i>`).join('')}</div><h2>${t}</h2><p>${x}</p><div class="introb">${i<INTRO.length-1?`<button class="chip" onclick="endIntro()">Überspringen</button><button class="btn" onclick="showIntro(${i+1})">Weiter</button>`:`<button class="btn" onclick="endIntro()">Los geht’s</button>`}</div></div>`}
function endIntro(){const o=$('intro');if(o)o.remove();ALL.onboarded=true;persist()}
if(!ALL.onboarded){if(ALL.book.books.length+ALL.manga.books.length)ALL.onboarded=true;else setTimeout(()=>{if(!ALL.onboarded)showIntro(0)},400)}

addEventListener('load',()=>{try{const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(A&&A.addListener)A.addListener('backButton',()=>{if(!window.androidBack())A.exitApp()})}catch(e){}});
/* Datenreparatur: 'finished' muss ein Datum sein */
(function(){try{for(const k of ['book','manga']){const t=ALL[k];if(!t||!t.books)continue;t.books.forEach(b=>{if(b.finished&&typeof b.finished!=='string'){b.finished=iso(b.added||b.id||Date.now());persist()}if(b.started&&typeof b.started!=='string'){b.started=iso(b.added||b.id||Date.now());persist()}})}}catch(e){}})();

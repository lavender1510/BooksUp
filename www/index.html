.book{position:relative}
.xoff{opacity:.6;margin-left:4px;cursor:pointer}

const wbars=()=>{const w=week(),m=Math.max(1,...w.map(x=>x.v));return`<div class="bars">${w.map(x=>`<div><i style="height:${x.v/m*44}px"></i>${'SMDMDFS'[new Date(x.d).getUTCDay()]}</div>`).join('')}</div>`};
function streak(){const s=new Set(S.log.map(l=>l.date));let n=0,t=Date.now();if(!s.has(iso(t)))t-=864e5;while(s.has(iso(t))){n++;t-=864e5}return n}
function genres(){const src=read().length?read():S.books,g={};src.forEach(b=>{const k=b.genre||'Ohne Genre';g[k]=(g[k]||0)+1});return Object.entries(g).sort((a,b)=>b[1]-a[1])}
function authors(){const src=read().length?read():S.books,g={};src.forEach(b=>{const k=(b.author||'').trim()||'Unbekannt';g[k]=(g[k]||0)+1});return Object.entries(g).sort((a,b)=>b[1]-a[1])}
function tagsList(){const src=read().length?read():S.books,g={};src.forEach(b=>tg(b.tags).forEach(t=>g[t]=(g[t]||0)+1));return Object.entries(g).sort((a,b)=>b[1]-a[1])}
function maxStreak(){const ds=[...new Set(S.log.map(l=>l.date))].sort();let best=0,cur=0,prev=null;for(const d of ds){if(prev&&(new Date(d)-new Date(prev))/864e5==1)cur++;else cur=1;best=Math.max(best,cur);prev=d}return best}

function trend(){const now=Date.now(),p30=l=>l.date>=iso(now-29*864e5),p60=l=>l.date>=iso(now-59*864e5)&&l.date<iso(now-29*864e5);
  const a=S.log.filter(p30).reduce((t,l)=>t+l.pages,0)/30,b=S.log.filter(p60).reduce((t,l)=>t+l.pages,0)/30;
  if(!b)return{txt:'Noch nicht genug Daten',dir:0};const d=((a-b)/b*100);return{txt:`${d>=0?'+':''}${d.toFixed(0)}% ggü. den 30 Tagen davor`,dir:d>2?1:d<-2?-1:0}}

function recs(){
  const selected=(S.rec.sources||[]).map(id=>S.books.find(b=>String(b.id)===String(id))).filter(Boolean);
  const last=selected.length?selected:[...read()].sort((a,b)=>String(b.finished).localeCompare(String(a.finished))).slice(0,3);
  const gs={},ts={},ignored=new Set((S.rec.exclude||[]).map(x=>x.toLowerCase()));
  const likedGenres=new Set(last.map(b=>norm(b.genre)).filter(Boolean)),likedTags=new Set(last.flatMap(b=>tg(b.tags)));
  last.forEach(b=>{if(!b.genre||ignored.has(b.genre.toLowerCase()))return;gs[b.genre]=(gs[b.genre]||0)+1;tg(b.tags).forEach(t=>ts[t]=(ts[t]||0)+1)});
  const have=new Set(S.books.map(b=>b.title.toLowerCase())),out=[];
  const good=b=>!ignored.has(norm(b.genre)) && !(b.rating!=null&&b.rating<=4) && (!S.rec.onlySimilar||!selected.length||likedGenres.has(norm(b.genre))||tg(b.tags).some(t=>likedTags.has(t)));
  if(S.rec.own)S.books.filter(b=>!b.finished&&good(b)).forEach(b=>out.push({...b,own:1}));
  if(S.rec.cat)CAT_().filter(c=>!have.has(c.title.toLowerCase())&&good(c)).forEach(c=>out.push(c));
  out.forEach(b=>{const m=gs[b.genre]?3*gs[b.genre]:0;b.sc=(S.rec.vary?(m?-5:2):m)+tg(b.tags).reduce((t,x)=>t+(S.rec.vary?0:ts[x]||0),0)+Math.random()*.4});
  return{list:out.sort((a,b)=>b.sc-a.sc).slice(0,5),last};
}

const KW=/^(kapitel|chapter|teil|part|buch|book)\s+(\d{1,3}|[ivxlc]{1,6}|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|one|two|three|four|five|six|seven|eight|nine|ten)\b[^.!?]{0,30}$/i;

      const out=[];

        const pi=typeof d[0]=='object'?await doc.getPageIndex(d[0]):+d[0];if(isNaN(pi))continue;

const bodyH=()=>{const a=[...hSamples].sort((x,y)=>x-y);return a.length?a[a.length>>1]:11};

    if(r&&Math.abs(r.y-y)<=Math.max(2,Math.min(r.h,h)*.45)){
      if(x-r.xr>h*.25&&!/\s$/.test(r.s)&&!/^\s/.test(it.str))r.s+=' ';
      r.s+=it.str;r.xr=Math.max(r.xr,x+w);r.h=Math.max(r.h,h)}

  if(S.focusLine&&!r){b.insertAdjacentHTML('beforeend',`<div class="ruler" id="ruler" style="height:${S.focusH||60}px"><div class="shade top"></div><div class="band" style="height:100%"></div><div class="shade bot"></div></div>`);drawRuler();bindRuler()}

const markAt=p=>((curBook()||{}).marks||[]).find(m=>m.p==p);
async function snippetAt(p){try{
  if(curKind=='epub'){const e=epub.paras.find(x=>x.p>=p&&x.t);return e?e.t.slice(0,70):''}
  if(curKind=='pdf'){const pg=await pageRows(p);return pg.rows.slice(0,3).map(r=>r.s).join(' ').slice(0,70)}}catch(e){}return''}
async function toggleMark(){
  const b=curBook();if(!b||!pdfDoc)return;b.marks=b.marks||[];const i=b.marks.findIndex(m=>m.p==pgNow);
  if(i>=0)b.marks.splice(i,1);else b.marks.push({id:Date.now(),p:pgNow,ts:Date.now(),note:'',label:await snippetAt(pgNow)});
  persist();updMarkBtn();if(rdSheet&&sheetTab=='mark')sheetRefresh()}
function updMarkBtn(){const e=$('rdmk');if(!e)return;const on=!!markAt(pgNow);e.textContent=on?'★':'☆';e.setAttribute('aria-pressed',on)}
function setNote(id,v){const m=((curBook()||{}).marks||[]).find(x=>x.id==id);if(m){m.note=v;persist()}}
function delMark(id){const b=curBook();if(b){b.marks=(b.marks||[]).filter(x=>x.id!=id);persist();updMarkBtn();sheetRefresh()}}
async function doSearch(){
  const q=($('sq').value||'').trim(),out=$('sres');if(!out)return;
  if(q.length<2){out.innerHTML='<p class="hint">Bitte mindestens 2 Zeichen eingeben.</p>';return}
  if(curKind=='cbz')return;
  const tk=++srchTok,ql=q.toLowerCase(),res=[],N=pdfDoc.numPages;
  const snip=(t,i)=>(i>35?'…':'')+t.slice(Math.max(0,i-35),i+q.length+45)+(i+q.length+45<t.length?'…':'');
  const show=(msg)=>{out.innerHTML=(msg?`<p class="hint">${msg}</p>`:'')+res.map(r=>`<button class="chl" onclick="goPage(${r.p});toggleSheet()"><div><small>Seite ${r.p}</small><br>${esc(r.s).replace(new RegExp(esR(esc(q)),'gi'),m=>'<mark>'+m+'</mark>')}</div></button>`).join('')};
  if(curKind=='epub'){for(const p of epub.paras){if(res.length>=80)break;if(!p.t)continue;const i=p.t.toLowerCase().indexOf(ql);if(i>=0)res.push({p:p.p,s:snip(p.t,i)})}}
  else for(let n=1;n<=N&&res.length<80;n++){
    if(tk!==srchTok)return;
    const pg=await pageRows(n),t=pg.rows.map(r=>r.s).join(' '),tl=t.toLowerCase();let i=tl.indexOf(ql),c=0;
    while(i>=0&&c<3&&res.length<80){res.push({p:n,s:snip(t,i)});i=tl.indexOf(ql,i+q.length);c++}
    if(n%8==0){show('Suche … Seite '+n+' von '+N);await yieldUI()}
  }
  if(tk!==srchTok)return;show(res.length?res.length+(res.length>=80?'+':'')+' Treffer':'Keine Treffer.');
}

function updAuto(){const b=$('rdauto');if(b){b.textContent=autoOn?'⏸':'▶';b.setAttribute('aria-pressed',autoOn)}}
function stopAuto(){autoOn=false;cancelAnimationFrame(autoRaf);updAuto()}
function toggleAuto(){
  if(autoOn){stopAuto();return}
  const sc=$('rdscroll');if(!sc||rdMode()==0)return;autoOn=true;updAuto();let last=performance.now(),acc=0;
  const tick=t=>{if(!autoOn)return;const dt=Math.min(.1,(t-last)/1000);last=t;
    const sp=[0,22,45,85][S.auto||2]*(rdMode()==2?(S.tfs||18)/18:1);acc+=sp*dt;const w=Math.floor(acc);
    if(w){sc.scrollTop+=w;acc-=w}
    if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2){stopAuto();return}
    autoRaf=requestAnimationFrame(tick)};
  autoRaf=requestAnimationFrame(tick)}

  <label>Buch suchen (Deutsch, Englisch, Autor oder ISBN)</label><input id="q" placeholder="z.B. Hunger Games oder Panem" oninput="search()"><div id="res" class="search-results" role="status"></div>

function keep(){['title','author','year','genre','tags','series','qty','price','pages'].forEach(k=>{const e=$('f_'+k);if(e)draft[k]=e.value})}
function pickPdf(){keep();raw('application/pdf,application/epub+zip,.epub,.cbz,.zip,application/vnd.comicbook+zip',async f=>{
  const n=f.name.toLowerCase();draft.fmt=/\.epub$/.test(n)?'epub':/\.(cbz|zip)$/.test(n)?'cbz':'pdf';draft.pdfFile=f;draft.pdfName=f.name;
  const base=f.name.replace(/\.[^.]+$/,'');
  try{
    if(draft.fmt=='epub'){const m=await epubMeta(f);if(!draft.title)draft.title=m.title||base;if(!draft.author&&m.author)draft.author=m.author;if(!draft.year&&m.year)draft.year=m.year;if(m.cover&&!(draft.covers||[]).length)draft.covers=[m.cover]}
    else if(draft.fmt=='cbz'){const m=await cbzMeta(f);if(!draft.title)draft.title=base;if(m.cover&&!(draft.covers||[]).length)draft.covers=[m.cover]}
    else {if(!draft.title)draft.title=base;const c=await pdfCover(f).catch(()=>null);if(c&&!(draft.covers||[]).length)draft.covers=[c]}
  }catch(e){console.error(e);if(!draft.title)draft.title=base}
  render()})}
function pickCover(){keep();raw('image/png,image/jpeg',f=>urlOf(f,d=>{draft.covers=[...(draft.covers||[]),d];render()}))}
let searchWait=0,searchSeq=0;
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('de').trim();
function showResults(msg=''){
  const box=$('res');if(!box)return;
  box.innerHTML=(window._res||[]).map((v,i)=>`<div class="li" role="button" tabindex="0" onclick="fill(${i})" onkeydown="if(event.key==='Enter')fill(${i})"><div><b>${esc(v.title)}</b><br><small>${esc(v.author||'Unbekannter Autor')} ${v.lang?' · '+esc(v.lang):''} ${v.source?' · '+esc(v.source):''}</small></div></div>`).join('')||(msg?`<p class="hint">${esc(msg)}</p>`:'');
}
function search(){const e=$('q');if(!e)return;const q=e.value.trim(),tk=++searchSeq;
  clearTimeout(searchWait);window._res=q?CAT_().filter(c=>norm(c.title+' '+c.author+' '+(c.en||'')).includes(norm(q))).slice(0,10):[];
  showResults(q?'Suche weitere Titel online …':'');if(q.length<2)return;
  searchWait=setTimeout(()=>searchOnline(q,tk),360);
}
async function searchOnline(q,tk){
  const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),8500),pool=[...(window._res||[])];
  try{
    const urls=[`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=20&printType=books`,
      `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=20&fields=title,author_name,first_publish_year,language,isbn,cover_i`];
    const res=await Promise.allSettled(urls.map(async(u,i)=>{const r=await fetch(u,{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();return i===0?(j.items||[]).map(x=>{const v=x.volumeInfo||{};return{title:v.title,author:(v.authors||[]).join(', '),year:(v.publishedDate||'').slice(0,4),genre:(v.categories||[])[0]||'',pages:v.pageCount,lang:v.language||'',source:'Google Books'}}):(j.docs||[]).map(v=>({title:v.title,author:(v.author_name||[]).slice(0,2).join(', '),year:v.first_publish_year,lang:(v.language||[]).includes('ger')?'de':(v.language||[]).includes('eng')?'en':'',source:'Open Library'}))}));
    if(tk!==searchSeq||!$('q')||$('q').value.trim()!==q)return;
    for(const it of res){if(it.status==='fulfilled')pool.push(...it.value.filter(x=>x.title))}
    const unique=new Set();window._res=pool.filter(v=>{const k=norm(v.title)+'|'+norm(v.author);if(unique.has(k))return false;unique.add(k);return true}).slice(0,30);
    showResults(window._res.length?'':'Keine Treffer. Du kannst das Buch manuell eintragen.');
  }catch(e){if(tk===searchSeq)showResults(window._res.length?'':'Onlinesuche nicht erreichbar. Manuelle Eingabe ist möglich.')}
  finally{clearTimeout(timeout)}
}
function fill(i){keep();draft={...draft,...window._res[i]};render()}

async function saveBook(){keep();if(!(draft.title||'').trim())return;const id=Date.now(),{pdfFile,pdfName,qty,price,...d}=draft;if(d.pages!==undefined)d.pages=+d.pages||undefined;
  if(addType=='physical'){
    const q=Math.max(1,+qty||1),pr=price!==undefined&&price!==''?+price:null,ex=S.books.find(b=>b.type=='physical'&&b.title.trim().toLowerCase()==d.title.trim().toLowerCase()&&(b.author||'').trim().toLowerCase()==(d.author||'').trim().toLowerCase());
    if(ex){
      if(pr!=null)ex.price=ex.price!=null?((ex.price*(ex.qty||1))+pr*q)/((ex.qty||1)+q):pr;
      ex.qty=(ex.qty||1)+q;ex.covers=[...(ex.covers||(ex.cover?[ex.cover]:[])),...(d.covers||[])];shf='physical';view='shelf';addType=null;draft={};return save()}
    S.books.push({id,added:id,type:'physical',...d,qty:q,price:pr,rating:null});shf='physical';view='shelf';addType=null;draft={};return save();
  }
  if(pdfFile&&!(await put(id,pdfFile))){toast('Die Datei konnte nicht gespeichert werden. Bitte Speicherplatz prüfen.');return}
  S.books.push({id,added:id,type:addType,...d,pdf:!!pdfFile,rating:null});shf=addType;view='shelf';addType=null;draft={};save()}

let holdTimer=0,heldBook=0,holdAt=null,ignoreClick=false;

document.addEventListener('pointermove',e=>{if(holdAt&&Math.hypot(e.clientX-holdAt.x,e.clientY-holdAt.y)>12)shelfCancel()},{passive:true});

async function pdfCover(file){const L=await pdfjs(),doc=await L.getDocument({data:await file.arrayBuffer()}).promise;try{const pg=await doc.getPage(1),v=pg.getViewport({scale:1}),scale=Math.min(1.6,480/Math.max(v.width,v.height)),vp=pg.getViewport({scale}),c=document.createElement('canvas');c.width=Math.max(1,Math.round(vp.width));c.height=Math.max(1,Math.round(vp.height));await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c.toDataURL('image/jpeg',.83)}finally{await doc.destroy().catch(()=>{})}}
let importing=false;

async function batchFiles(files){if(importing)return;importing=true;let added=0,failed=0,skipped=0;
  modal=`<h3>Mehrere Bücher importieren</h3><p class="hint" id="batchstatus">0 / ${files.length} verarbeitet …</p>`;render();
  for(let i=0;i<files.length;i++){
    const f=files[i],name=f.name.replace(/\.[^.]+$/,''),fmt=/\.epub$/i.test(f.name)?'epub':/\.(cbz|zip)$/i.test(f.name)?'cbz':'pdf';
    if(S.books.some(b=>b.type==='digital'&&b.title.toLowerCase()===name.toLowerCase())){skipped++;continue}
    if(!/\.(pdf|epub|cbz|zip)$/i.test(f.name)){failed++;continue}
    const id=Date.now()*100+i;
    try{let meta={title:name,author:'',covers:[]};if(fmt==='epub'){const m=await epubMeta(f);meta={...meta,title:m.title||name,author:m.author||'',year:m.year||'',covers:m.cover?[m.cover]:[]}}else if(fmt==='cbz'){const m=await cbzMeta(f);if(m.cover)meta.covers=[m.cover]}else{const c=await pdfCover(f).catch(()=>null);if(c)meta.covers=[c]}
      if(!await put(id,f))throw Error('Lokaler Dateispeicher fehlgeschlagen');S.books.push({id,added:Date.now()+i,type:'digital',...meta,fmt,pdf:true,rating:null});added++;
    }catch(e){failed++;console.error('Import:',f.name,e)}
    const t=$('batchstatus');if(t)t.textContent=`${i+1} / ${files.length} verarbeitet …`;
  }
  importing=false;shf='digital';view='shelf';addType=null;draft={};modal=null;save();toast(`${added} importiert · ${skipped} übersprungen · ${failed} fehlgeschlagen`)
}

/* ---------- Goodreads-Import ---------- */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
    else{if(c=='"')q=true;else if(c==','){row.push(cur);cur=''}else if(c=='\r'){}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''))}
function gqDate(s){if(!s)return null;const d=new Date(s.trim());return isNaN(d.getTime())?null:iso(d.getTime())}
function gqPick(){raw('.csv,text/csv',f=>{const r=new FileReader();
  r.onload=()=>{try{gqRun(String(r.result))}catch(e){console.error(e);alert('Import fehlgeschlagen: '+((e&&e.message)||e))}};
  r.onerror=()=>alert('Datei konnte nicht gelesen werden.');
  r.readAsText(f,'utf-8')})}
function gqRun(text){
  const rows=parseCSV(text);
  if(rows.length<2)return alert('Keine Daten gefunden. Ist das eine Goodreads-Export-CSV (Mein Konto → Tools → Import/Export)?');
  const head=rows[0].map(h=>h.trim().replace(/^﻿/,'')),idx=n=>head.indexOf(n);
  const iTitle=idx('Title'),iAuthor=idx('Author'),iRating=idx('My Rating'),iYearO=idx('Original Publication Year'),iYearP=idx('Year Published'),
        iPages=idx('Number of Pages'),iShelf=idx('Exclusive Shelf'),iDateRead=idx('Date Read'),iDateAdd=idx('Date Added'),iShelves=idx('Bookshelves');
  if(iTitle<0||iAuthor<0)return alert('CSV sieht nicht wie ein Goodreads-Export aus (Spalte „Title" oder „Author" fehlt).');
  let added=0,skipped=0;
  for(let k=1;k<rows.length;k++){
    const r=rows[k];if(!r||!(r[iTitle]||'').trim())continue;
    const title=(r[iTitle]||'').trim(),author=(r[iAuthor]||'').trim();
    const ex=S.books.find(b=>b.title.trim().toLowerCase()==title.toLowerCase()&&(b.author||'').trim().toLowerCase()==author.toLowerCase());
    if(ex){skipped++;continue}
    const shelf=(iShelf>=0?r[iShelf]:'').trim();
    const ratingN=iRating>=0?+r[iRating]:0;
    const year=((iYearO>=0&&r[iYearO])||(iYearP>=0&&r[iYearP])||'').trim();
    const pages=iPages>=0?(+r[iPages]||undefined):undefined;
    const tags=iShelves>=0?(r[iShelves]||'').split(',').map(s=>s.trim()).filter(s=>s&&!['read','to-read','currently-reading'].includes(s)).join(', '):'';
    const b={id:Date.now()+k,added:Date.now()+k,type:'physical',title,author,year,tags,qty:1,price:null,pages,rating:ratingN>0?Math.min(5,ratingN):null};
    if(shelf=='read'){b.finished=gqDate(iDateRead>=0?r[iDateRead]:'')||gqDate(iDateAdd>=0?r[iDateAdd]:'')||iso(Date.now());b.started=b.finished}
    else if(shelf=='currently-reading'){b.started=gqDate(iDateAdd>=0?r[iDateAdd]:'')||iso(Date.now())}
    S.books.push(b);added++}
  shf='physical';view='shelf';addType=null;draft={};save();
  modal=`<h3 style="margin:0 0 8px">Goodreads-Import</h3><p>${added} Bücher hinzugefügt als physisch (gelesen/wird gelesen anhand deiner Goodreads-Regale übernommen).${skipped?' '+skipped+' waren schon vorhanden und wurden übersprungen.':''}</p><button class="btn" onclick="modal=null;render()">Schließen</button>`;render()}

  return bar('Ziele')+`<div class="card"><label>Was?</label><select id="gu"><option>Kapitel</option><option>Bücher</option><option>Seiten</option></select><label>Zeitraum</label><select id="gp"><option>Tag</option><option selected>Woche</option><option>Monat</option><option>Jahr</option></select>

const FBK='booksup_fbcfg';

const fbOn=()=>!!(FBCFG.apiKey&&FBCFG.projectId),hasCl=()=>typeof claude!=='undefined'&&!!claude.use;
const fsf=o=>Object.fromEntries(Object.entries(o).filter(([k,v])=>v!==undefined).map(([k,v])=>[k,fsv(v)]));
const fsv=v=>v===null||v===undefined?{nullValue:null}:typeof v=='string'?{stringValue:v}:typeof v=='boolean'?{booleanValue:v}:typeof v=='number'?(Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v}):Array.isArray(v)?{arrayValue:{values:v.map(fsv)}}:{mapValue:{fields:fsf(v)}};
const unfsf=f=>Object.fromEntries(Object.entries(f).map(([k,v])=>[k,unfs(v)]));
const unfs=v=>'stringValue'in v?v.stringValue:'integerValue'in v?+v.integerValue:'doubleValue'in v?v.doubleValue:'booleanValue'in v?v.booleanValue:'arrayValue'in v?(v.arrayValue.values||[]).map(unfs):'mapValue'in v?unfsf(v.mapValue.fields||{}):null;
let fbAuth=null,tokP=null;
const fbToken=()=>tokP||(tokP=fbTok().finally(()=>{tokP=null}));
async function fbTok(){
  if(fbAuth&&fbAuth.exp>Date.now()+60000)return fbAuth;
  const K=FBCFG.apiKey;
  if(ALL.fbRefresh){
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+K,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(ALL.fbRefresh)});
    if(r.ok){const j=await r.json();fbAuth={uid:j.user_id,token:j.id_token,exp:Date.now()+(+j.expires_in)*1000};if(j.refresh_token&&j.refresh_token!==ALL.fbRefresh){ALL.fbRefresh=j.refresh_token;persist()}return fbAuth}
    if(r.status>=500)throw new Error('server '+r.status);
  }
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+K,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'});
  if(!r.ok)throw new Error('auth '+r.status);
  const j=await r.json();fbAuth={uid:j.localId,token:j.idToken,exp:Date.now()+(+j.expiresIn)*1000};ALL.fbRefresh=j.refreshToken;persist();return fbAuth}
async function fs(path,opt={}){
  const a=await fbToken(),r=await fetch('https://firestore.googleapis.com/v1/projects/'+FBCFG.projectId+'/databases/(default)/documents'+path,{...opt,headers:{'Authorization':'Bearer '+a.token,'Content-Type':'application/json'}});
  if(r.status==404)return null;if(!r.ok)throw new Error('fs '+r.status);return r.json()}
const fbUS={id:async()=>(await fbToken()).uid,

const fbDB={
  doc:p=>({
    set:async d=>{await fs('/'+p,{method:'PATCH',body:JSON.stringify({fields:fsf(d)})})},
    get:async()=>{const j=await fs('/'+p);return{data:()=>j?unfsf(j.fields||{}):undefined}}}),
  collection:p=>{const c={orderBy:()=>c,limit:()=>c,
    add:async d=>{await fs('/'+p,{method:'POST',body:JSON.stringify({fields:fsf(d)})})},
    onSnapshot:(cb,er)=>{let on=true,t=null;
      const tick=async()=>{clearTimeout(t);if(!on)return;
        if(view!=='chat'){on=false;subFor=null;return}
        if(!document.hidden){try{const parts=p.split('/'),col=parts.pop(),j=await fs('/'+parts.join('/')+':runQuery',{method:'POST',body:JSON.stringify({structuredQuery:{from:[{collectionId:col}],orderBy:[{field:{fieldPath:'ts'},direction:'DESCENDING'}],limit:100}})});
          cb({docs:(j||[]).filter(x=>x.document).map(x=>({data:()=>unfsf(x.document.fields||{})})).reverse()})}catch(e){er&&er(e)}}
        if(on)t=setTimeout(tick,3000)};
      window._chatPoll=tick;tick();return()=>{on=false;clearTimeout(t)}}};
    return c}};

let lastTry=0,socialErr=false,errDrawn=false,reqs=[];
async function ensureSocial(){
  if(socialReady)return true;
  if(Date.now()-lastTry<15000)return false;
  lastTry=Date.now();
  try{
    if(hasCl()){US=await claude.use('user');DB=await claude.use('db')}
    else if(fbOn()){US=fbUS;DB=fbDB}
    else return false;
    if(US)ME=await US.id();
    if(DB&&ME){try{await DB.doc('codes/'+ALL.code).set({id:ME})}catch(e){if(DB===fbDB&&!/fs 403/.test(e.message))throw e}}
    socialReady=!!(US||DB);socialErr=!socialReady;return socialReady;
  }catch(e){US=DB=null;socialErr=true;return false}
}

async function saveFileOut(name,blob){
  const C=window.Capacitor&&Capacitor.Plugins;
  try{if(C&&C.Filesystem&&C.Share){
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(blob)});

const isbnClean=v=>String(v||'').replace(/[^0-9Xx]/g,'').toUpperCase();
function isbnValid(v){v=isbnClean(v);

  return false}

  try{const j=await T(`https://openlibrary.org/api/books?bibkeys=ISBN:${i}&format=json&jscmd=data`),d=j['ISBN:'+i];
    if(d)return{title:d.title+(d.subtitle?': '+d.subtitle:''),author:(d.authors||[]).map(a=>a.name).join(', '),year:((d.publish_date||'').match(/\d{4}/)||[''])[0],pages:d.number_of_pages||'',tags:(d.subjects||[]).slice(0,3).map(s=>s.name).join(', '),cover:d.cover&&(d.cover.large||d.cover.medium)}}catch(e){}

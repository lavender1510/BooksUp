# BooksUp-operated LibreTranslate: free, self-hosted, no paid API key.
# Requires a DNS name pointing to this host and open TCP ports 80/443.
services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_HOST: "0.0.0.0"
      LT_PORT: "5000"
      LT_LOAD_ONLY: "de,en,fr,es,it"
      LT_API_KEYS: "false"
      LT_REQUIRE_API_KEY_SECRET: "false"
      LT_REQ_LIMIT: "30"
      LT_HOURLY_REQ_LIMIT: "300"
      LT_CHAR_LIMIT: "200"
      LT_BATCH_LIMIT: "12"
      LT_THREADS: "2"
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - translation_models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    # Never expose port 5000 directly to the public Internet.
    networks:
      - translation_net

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      libretranslate:
        condition: service_healthy
    environment:
      TRANSLATE_DOMAIN: ${TRANSLATE_DOMAIN:?Set TRANSLATE_DOMAIN in the deployment .env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - translation_net

networks:
  translation_net:

volumes:
  translation_models:
  caddy_data:
  caddy_config:
